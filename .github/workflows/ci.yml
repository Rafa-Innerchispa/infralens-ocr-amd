name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python -m compileall -q app tests scripts
      - run: python -m unittest discover -s tests -v
      - run: OCR_BACKEND=stub python scripts/selfcheck.py
      - name: Verify mandated AMD base is unchanged
        run: grep -Fx 'FROM rocm/pytorch:rocm10.0_ubuntu26.04_py3.14_pytorch_release_2.13.0' Dockerfile
